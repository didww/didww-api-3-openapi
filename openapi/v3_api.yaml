    EmergencyRequirement:
      type: object
      description: The rules for activating emergency calling in a country, for a DID group type.
      required:
      - id
      - type
      - attributes
      - relationships
      - meta
      properties:
        id:
          type: string
          format: uuid
          example: e5a4e2f1-3b26-4a5c-9a0a-2f7c1f3e8d10
        type:
          type: string
          enum:
          - emergency_requirements
        attributes:
          type: object
          required:
          - identity_type
          - personal_area_level
          - business_area_level
          - address_area_level
          - personal_mandatory_fields
          - business_mandatory_fields
          - address_mandatory_fields
          - estimate_setup_time
          - requirement_restriction_message
          properties:
            identity_type:
              type: string
              description: Which kind of identity the country accepts. `any` means either.
              enum:
              - any
              - business
              - personal
            personal_area_level:
              type: string
              description: How close to the number a personal identity must be located.
              enum:
              - world_wide
              - country
              - area
              - city
            business_area_level:
              type: string
              description: How close to the number a business identity must be located.
              enum:
              - world_wide
              - country
              - area
              - city
            address_area_level:
              type: string
              description: How close to the number the registered address must be located.
              enum:
              - world_wide
              - country
              - area
              - city
            personal_mandatory_fields:
              type: array
              nullable: true
              description: Fields that must be filled in for a personal identity. Null when none are.
              items:
                type: string
            business_mandatory_fields:
              type: array
              nullable: true
              description: Fields that must be filled in for a business identity. Null when none are.
              items:
                type: string
            address_mandatory_fields:
              type: array
              nullable: true
              description: Fields that must be filled in for the address. Null when none are.
              items:
                type: string
            estimate_setup_time:
              type: string
              description: How long activation usually takes.
              example: 3 business days
            requirement_restriction_message:
              type: string
              nullable: true
              description: Restrictions the country places on emergency calling.
        relationships:
          type: object
          required:
          - country
          - did_group_type
          properties:
            country:
              "$ref": "#/components/schemas/RelationshipToOne"
            did_group_type:
              "$ref": "#/components/schemas/RelationshipToOne"
        meta:
          type: object
          properties:
            setup_price:
              type: integer
              nullable: true
              description: One-off activation charge. Always `0` when priced, null when this account has no emergency rate for the country and group type.
            monthly_price:
              type: string
              nullable: true
              description: Recurring monthly charge, as a decimal string. Null when not priced for this account.
          required:
          - setup_price
          - monthly_price
