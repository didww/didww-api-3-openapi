    DidGroup:
      type: object
      description: A block of numbers sharing a country, city, type and prefix.
      required:
      - id
      - type
      - attributes
      - relationships
      - meta
      properties:
        id:
          type: string
          format: uuid
          example: e5a4e2f1-3b26-4a5c-9a0a-2f7c1f3e8d10
        type:
          type: string
          enum:
          - did_groups
        attributes:
          type: object
          required:
          - prefix
          - area_name
          - features
          - is_metered
          - allow_additional_channels
          - service_restrictions
          properties:
            prefix:
              type: string
              description: Full dialling prefix of the group, including the country code.
              example: '4420'
            area_name:
              type: string
              description: Human-readable area the group covers.
              example: London
            features:
              type: array
              description: Services the numbers in this group support.
              items:
                type: string
                enum:
                - voice_in
                - voice_out
                - t38
                - sms_in
                - p2p
                - a2p
                - emergency
                - cnam_out
            is_metered:
              type: boolean
              description: True when inbound minutes are billed per minute rather than included.
            allow_additional_channels:
              type: boolean
              description: True when extra channels can be bought for a DID from this group.
            service_restrictions:
              type: string
              nullable: true
              description: Restrictions that apply to numbers in this group, if any.
        relationships:
          type: object
          required:
          - country
          - city
          - did_group_type
          - region
          - stock_keeping_units
          - address_requirement
          properties:
            country:
              "$ref": "#/components/schemas/RelationshipToOne"
            city:
              "$ref": "#/components/schemas/RelationshipToOne"
            did_group_type:
              "$ref": "#/components/schemas/RelationshipToOne"
            region:
              "$ref": "#/components/schemas/RelationshipToOne"
            stock_keeping_units:
              "$ref": "#/components/schemas/RelationshipToMany"
            address_requirement:
              "$ref": "#/components/schemas/RelationshipToOne"
        meta:
          type: object
          properties:
            available_dids_enabled:
              type: boolean
              description: True when specific numbers from this group can be picked through /available_dids rather than bought in bulk.
            needs_registration:
              type: boolean
              description: True when buying from this group requires a verified address.
            is_available:
              type: boolean
              description: True when numbers are currently in stock.
            total_count:
              type: integer
              description: Numbers currently in stock.
          required:
          - available_dids_enabled
