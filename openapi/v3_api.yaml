    CapacityPool:
      type: object
      description: A pool of channels the customer has bought, shared across DIDs.
      required:
      - id
      - type
      - attributes
      - relationships
      properties:
        id:
          type: string
          format: uuid
          example: e5a4e2f1-3b26-4a5c-9a0a-2f7c1f3e8d10
        type:
          type: string
          enum:
          - capacity_pools
        attributes:
          type: object
          required:
          - name
          - renew_date
          - total_channels_count
          - assigned_channels_count
          - minimum_limit
          - minimum_qty_per_order
          - setup_price
          - monthly_price
          - metered_rate
          properties:
            name:
              type: string
              description: Name of the pool template.
              example: Europe
            renew_date:
              type: string
              format: date
              description: Next renewal date.
            total_channels_count:
              type: integer
              description: Channels owned.
            assigned_channels_count:
              type: integer
              description: Channels currently assigned to DIDs.
            minimum_limit:
              type: integer
              description: Fewest channels the pool can be shrunk to.
            minimum_qty_per_order:
              type: integer
              description: Fewest channels a single capacity order must buy.
            setup_price:
              type: string
              description: One-off charge per channel, as a decimal string.
              example: '1.00'
            monthly_price:
              type: string
              description: Recurring monthly charge per channel, as a decimal string.
              example: '5.00'
            metered_rate:
              type: string
              description: Per-minute rate applied once the pool is exhausted, as a decimal string.
              example: '0.0100'
        relationships:
          type: object
          required:
          - countries
          - shared_capacity_groups
          - qty_based_pricings
          properties:
            countries:
