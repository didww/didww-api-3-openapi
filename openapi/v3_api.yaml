    VoiceOutTrunk:
      type: object
      description: 'An outbound voice trunk: where DIDWW accepts calls from and how it authenticates them.'
      required:
      - id
      - type
      - attributes
      - relationships
      - meta
      properties:
        id:
          type: string
          format: uuid
          example: e5a4e2f1-3b26-4a5c-9a0a-2f7c1f3e8d10
        type:
          type: string
          enum:
          - voice_out_trunks
        attributes:
          type: object
          required:
          - name
          - status
          - external_reference_id
          - capacity_limit
          - allow_any_did_as_cli
          - on_cli_mismatch_action
          - default_dst_action
          - dst_prefixes
          - media_encryption_mode
          - allowed_rtp_ips
          - force_symmetric_rtp
          - rtp_ping
          - rtp_timeout
          - threshold_amount
          - callback_url
          - emergency_enable_all
          - created_at
          - threshold_reached
          - authentication_method
          properties:
            name:
              type: string
              example: Outbound EU
            status:
              type: string
              description: Set to `blocked` to stop the trunk from placing calls.
              enum:
              - active
              - blocked
            external_reference_id:
              type: string
              nullable: true
              description: Customer's own identifier for the trunk.
            capacity_limit:
              type: integer
              nullable: true
              description: Maximum simultaneous outbound calls. Null means no limit.
            allow_any_did_as_cli:
              type: boolean
              description: Allow any DID the customer owns as the caller ID. While true the `dids` relationship is managed automatically and cannot be assigned.
            on_cli_mismatch_action:
              type: string
              description: What to do when the caller ID is not one of the allowed DIDs.
              enum:
              - reject_call
              - replace_cli
              - send_original_cli
              - randomize_cli
            default_dst_action:
              type: string
              description: Whether destinations not listed in `dst_prefixes` are allowed.
              enum:
              - allow_all
              - reject_all
            dst_prefixes:
              type: array
              description: Destination prefixes the `default_dst_action` is inverted for.
              items:
                type: string
            media_encryption_mode:
              type: string
              description: Media encryption required of the trunk.
              enum:
              - disabled
              - srtp_sdes
              - srtp_dtls
              - zrtp
            allowed_rtp_ips:
              type: array
              nullable: true
              description: Restrict RTP to these addresses. Null means no restriction.
              items:
                type: string
            force_symmetric_rtp:
              type: boolean
              description: Learn the remote RTP address from arriving packets.
            rtp_ping:
              type: boolean
              description: Send RTP keep-alives.
            rtp_timeout:
              type: integer
              description: Drop the call after this many seconds of RTP silence.
            threshold_amount:
              type: string
              description: Spending on the trunk that triggers a notification, as a decimal string.
              example: '100.00'
            callback_url:
              type: string
              nullable: true
              description: URL notified when the spending threshold is reached.
            emergency_enable_all:
              type: boolean
              description: Allow emergency calls from any DID the customer owns. While true the `emergency_dids` relationship cannot be assigned.
            created_at:
              type: string
              format: date-time
            threshold_reached:
              type: boolean
              description: True once spending on the trunk has passed `threshold_amount`.
            authentication_method:
              description: 'How DIDWW authenticates calls from the trunk. `attributes` is determined by `type`: `credentials_and_ip` returns the generated `username` / `password` alongside the allowed addresses, `ip_only` authenticates by address alone, and `twilio` trusts a Twilio account SID.'
              anyOf:
              - title: CredentialsAndIpAuthentication
                type: object
                description: SIP digest credentials generated by DIDWW, plus an address allowlist.
                required:
                - type
                - attributes
                properties:
                  type:
                    type: string
                    enum:
                    - credentials_and_ip
                  attributes:
                    type: object
                    properties:
                      allowed_sip_ips:
                        type: array
                        nullable: true
                        description: Addresses calls are accepted from.
                        items:
                          type: string
                          example: 203.0.113.10
                      tech_prefix:
                        type: string
                        nullable: true
                        description: Prefix stripped from the dialled number before routing.
                      username:
                        type: string
                        nullable: true
                        description: Generated SIP username. Read-only.
                      password:
                        type: string
                        nullable: true
                        description: Generated SIP password. Read-only.
                    required:
                    - allowed_sip_ips
                    - tech_prefix
                    - username
                    - password
              - title: IpOnlyAuthentication
                type: object
                description: Address allowlist only. The allowlist is read-only once set.
                required:
                - type
                - attributes
                properties:
                  type:
                    type: string
                    enum:
                    - ip_only
                  attributes:
                    type: object
                    properties:
                      allowed_sip_ips:
                        type: array
                        nullable: true
                        description: Addresses calls are accepted from.
                        items:
                          type: string
                          example: 203.0.113.10
                      tech_prefix:
                        type: string
                        nullable: true
                        description: Prefix stripped from the dialled number before routing.
                    required:
                    - allowed_sip_ips
                    - tech_prefix
              - title: TwilioAuthentication
                type: object
                description: A Twilio Elastic SIP Trunking account SID.
                required:
                - type
                - attributes
                properties:
                  type:
                    type: string
                    enum:
                    - twilio
                  attributes:
                    type: object
                    properties:
                      twilio_account_sid:
                        type: string
                        example: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                    required:
                    - twilio_account_sid
        relationships:
          type: object
          required:
          - dids
          - emergency_dids
          properties:
            dids:
              "$ref": "#/components/schemas/RelationshipToMany"
            emergency_dids:
              "$ref": "#/components/schemas/RelationshipToMany"
        meta:
          type: object
          properties:
            spent_amount:
              type: string
              description: Spent on this trunk in the current billing period, as a decimal string.
              example: '12.34'
          required:
          - spent_amount
