    AddressVerification:
      type: object
      description: A submission asking DIDWW to approve an address for a set of DIDs.
      required:
      - id
      - type
      - attributes
      - relationships
      properties:
        id:
          type: string
          format: uuid
          example: e5a4e2f1-3b26-4a5c-9a0a-2f7c1f3e8d10
        type:
          type: string
          enum:
          - address_verifications
        attributes:
          type: object
          required:
