                              type: string
                              example: 203.0.113.10
                          tech_prefix:
                            type: string
                            nullable: true
                            description: Prefix stripped from the dialled number before routing.
                  - title: IpOnlyAuthentication
                    type: object
                    description: Address allowlist only. The allowlist is read-only once set.
                    required:
                    - type
                    - attributes
                    properties:
                      type:
                        type: string
                        enum:
                        - ip_only
                      attributes:
                        type: object
                        properties:
                          allowed_sip_ips:
                            type: array
                            nullable: true
                            description: Addresses calls are accepted from.
                            items:
                              type: string
                              example: 203.0.113.10
                          tech_prefix:
                            type: string
                            nullable: true
                            description: Prefix stripped from the dialled number before routing.
                  - title: TwilioAuthentication
                    type: object
                    description: A Twilio Elastic SIP Trunking account SID.
                    required:
                    - type
                    - attributes
                    properties:
                      type:
                        type: string
                        enum:
                        - twilio
                      attributes:
                        type: object
                        properties:
