    - name: id
      in: path
      required: true
      description: Voice IN trunk identifier.
      schema:
        type: string
        format: uuid
    get:
      summary: Read a voice IN trunk
      tags:
      - Voice IN trunks
      operationId: getVoiceInTrunk
      parameters:
      - "$ref": "#/components/parameters/ApiVersion"
      - name: include
        in: query
        required: false
        description: Comma-separated relationships to return in the top-level `included` array. Nested paths (`a.b`) are supported where the related resource is documented.
        schema:
          type: string
          enum:
          - voice_in_trunk_group
          - pop
        example: voice_in_trunk_group
      - "$ref": "#/components/parameters/VoiceInTrunkFields"
      responses:
        '200':
          description: trunk returned
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/VoiceInTrunkDocument"
        '404':
          description: no trunk with that id belongs to the customer
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ErrorsDocument"
    patch:
      summary: Update a voice IN trunk
      tags:
      - Voice IN trunks
      operationId: updateVoiceInTrunk
      description: Updates a trunk. Sending `configuration` replaces the whole object, so every attribute to keep must be sent with it.
      parameters:
      - "$ref": "#/components/parameters/ApiVersion"
      responses:
        '200':
          description: trunk updated
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/VoiceInTrunkDocument"
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/VoiceInTrunkUpdateRequest"
        required: true
    delete:
      summary: Delete a voice IN trunk
      tags:
      - Voice IN trunks
      operationId: deleteVoiceInTrunk
      description: Deletes a trunk. DIDs routed to it are left unrouted.
      parameters:
      - "$ref": "#/components/parameters/ApiVersion"
      responses:
        '204':
          description: trunk deleted
        '404':
          description: no trunk with that id belongs to the customer
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ErrorsDocument"
