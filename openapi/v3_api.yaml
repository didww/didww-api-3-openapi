    AddressRequirement:
      type: object
      description: The registration rules for a country and DID group type.
      required:
      - id
      - type
      - attributes
      - relationships
      properties:
        id:
          type: string
          format: uuid
          example: e5a4e2f1-3b26-4a5c-9a0a-2f7c1f3e8d10
        type:
          type: string
          enum:
          - address_requirements
        attributes:
          type: object
          required:
          - identity_type
          - personal_area_level
          - business_area_level
          - address_area_level
          - personal_proof_qty
          - business_proof_qty
          - address_proof_qty
          - personal_mandatory_fields
          - business_mandatory_fields
          - service_description_required
          - restriction_message
          properties:
            identity_type:
              type: string
              description: Which kind of identity the country accepts. `any` means either.
              enum:
              - any
              - personal
              - business
            personal_area_level:
              type: string
              description: How close to the number a personal identity must be located.
              enum:
              - world_wide
              - country
              - area
              - city
            business_area_level:
              type: string
              description: How close to the number a business identity must be located.
              enum:
              - world_wide
              - country
              - area
              - city
            address_area_level:
              type: string
              description: How close to the number the address itself must be located.
              enum:
              - world_wide
              - country
              - area
              - city
            personal_proof_qty:
              type: integer
              description: Proofs required of a personal identity.
            business_proof_qty:
              type: integer
              description: Proofs required of a business identity.
            address_proof_qty:
              type: integer
              description: Proofs required of the address.
            personal_mandatory_fields:
              type: array
              nullable: true
              description: Identity fields that must be filled in for a personal identity. Null when none are.
              items:
                type: string
                enum:
                - birth_date
                - birth_country
                - country
                - personal_tax_id
                - id_number
                - vat_id
                - company_reg_number
                - contact_email
            business_mandatory_fields:
              type: array
              nullable: true
              description: Identity fields that must be filled in for a business identity. Null when none are.
              items:
                type: string
                enum:
                - birth_date
                - birth_country
                - country
                - personal_tax_id
                - id_number
                - vat_id
                - company_reg_number
                - contact_email
            service_description_required:
              type: boolean
              description: True when the address verification must describe how the number will be used.
            restriction_message:
              type: string
              description: Restrictions the country places on these numbers.
        relationships:
          type: object
          required:
          - country
          - did_group_type
          - personal_permanent_document
          - business_permanent_document
          - personal_onetime_document
          - business_onetime_document
          - personal_proof_types
          - business_proof_types
          - address_proof_types
          properties:
            country:
              "$ref": "#/components/schemas/RelationshipToOne"
            did_group_type:
              "$ref": "#/components/schemas/RelationshipToOne"
            personal_permanent_document:
              "$ref": "#/components/schemas/RelationshipToOne"
            business_permanent_document:
              "$ref": "#/components/schemas/RelationshipToOne"
            personal_onetime_document:
              "$ref": "#/components/schemas/RelationshipToOne"
            business_onetime_document:
              "$ref": "#/components/schemas/RelationshipToOne"
            personal_proof_types:
              "$ref": "#/components/schemas/RelationshipToMany"
            business_proof_types:
              "$ref": "#/components/schemas/RelationshipToMany"
            address_proof_types:
              "$ref": "#/components/schemas/RelationshipToMany"
