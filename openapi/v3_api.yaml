    OrderCreateRequest:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              enum:
              - orders
            attributes:
              type: object
              properties:
                items:
                  type: array
                  minItems: 1
                  description: Items to order.
                  items:
                    description: An item to order. The accepted `attributes` are determined by `type`.
                    anyOf:
                    - title: DidOrderItemRequest
                      type: object
                      description: Buy numbers from a stock keeping unit. Supply `sku_id` plus exactly one of `qty`, `did_reservation_id` or `available_did_id` — sending more than one is rejected.
                      required:
                      - type
                      - attributes
                      properties:
                        type:
                          type: string
                          enum:
                          - did_order_items
                        attributes:
                          type: object
                          properties:
                            sku_id:
                              type: string
                              format: uuid
                              description: Stock keeping unit to buy from.
                            qty:
                              type: integer
                              minimum: 1
                              description: How many numbers to buy from the SKU.
                            did_reservation_id:
                              type: string
                              format: uuid
                              description: Buy the number held by this reservation.
                            available_did_id:
                              type: string
                              format: uuid
                              description: Buy this specific available number.
                            nanpa_prefix_id:
                              type: string
                              format: uuid
                              description: Restrict the numbers to this NANPA prefix.
                            billing_cycles_count:
                              type: integer
                              description: Billing cycles to keep the numbers for before releasing them. Omit to renew indefinitely.
                    - title: CapacityOrderItemRequest
                      type: object
                      description: Buy channels for a capacity pool.
                      required:
                      - type
                      - attributes
                      properties:
                        type:
                          type: string
                          enum:
                          - capacity_order_items
                        attributes:
                          type: object
                          properties:
                            qty:
                              type: integer
                              minimum: 1
                              description: How many channels to buy.
                            capacity_pool_id:
                              type: string
                              format: uuid
                              description: Capacity pool to add the channels to.
                allow_back_ordering:
                  type: boolean
                  description: Place the order even when some numbers are not immediately available.
                callback_url:
                  type: string
                  description: URL to notify when the order completes.
                callback_method:
                  type: string
                  enum:
                  - get
                  - post
                  description: HTTP method for the callback.
                external_reference_id:
                  type: string
                  description: Customer's own identifier.
              required:
              - items
    OrderUpdateRequest:
      type: object
      description: Only the external reference of a placed order can be changed.
      required:
      - data
      properties:
        data:
          type: object
          required:
          - id
          - type
          properties:
            type:
              type: string
              enum:
