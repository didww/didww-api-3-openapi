---
openapi: 3.0.3
info:
  title: DIDWW Public API
  version: '2026-04-16'
  description: |
    JSONAPI interface to the DIDWW platform: browse coverage, order and manage DIDs,
    route them to voice trunks, and reserve numbers before purchase.

    Every request is authenticated with an `api-key` header. Versions are selected
    per request with the `X-DIDWW-Api-Version` header, defaulting to the
    version configured for the API key's customer; this document describes
    `2026-04-16`.
servers:
- url: https://api.didww.com/v3
  description: Production
- url: https://sandbox-api.didww.com/v3
  description: Sandbox
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: api-key
      in: header
      description: API key issued to the customer in the DIDWW user panel.
  schemas:
    Meta:
      type: object
      required:
      - api_version
      properties:
        api_version:
          type: string
          description: V3 API version that served the request.
          example: '2026-04-16'
    CollectionMeta:
      type: object
      required:
      - api_version
      - total_records
      properties:
        api_version:
          type: string
          description: V3 API version that served the request.
          example: '2026-04-16'
        total_records:
          type: integer
          description: Total number of records matching the request.
    ResourceIdentifier:
      type: object
      description: JSONAPI resource identifier object.
      required:
      - type
      - id
      properties:
        type:
          type: string
          description: Resource type, e.g. `voice_in_trunks`.
        id:
          type: string
          format: uuid
          example: e5a4e2f1-3b26-4a5c-9a0a-2f7c1f3e8d10
    RelationshipLinks:
      type: object
      required:
      - self
      - related
      properties:
        self:
          type: string
          format: uri
          description: Relationship linkage endpoint.
        related:
          type: string
          format: uri
          description: Related resource endpoint.
    RelationshipToOne:
      type: object
      required:
      - links
      properties:
        links:
          "$ref": "#/components/schemas/RelationshipLinks"
        data:
          "$ref": "#/components/schemas/ResourceIdentifier"
          nullable: true
          description: Linkage. Present only when the relationship is requested via `include`; null when nothing is related.
    RelationshipToMany:
      type: object
      required:
      - links
      properties:
        links:
          "$ref": "#/components/schemas/RelationshipLinks"
        data:
          type: array
          description: Linkage. Present only when the relationship is requested via `include`.
          items:
            "$ref": "#/components/schemas/ResourceIdentifier"
    PaginationLinks:
      type: object
      description: Pagination links. `next` / `prev` are omitted at the respective ends of the collection.
      required:
      - first
      - last
      properties:
        first:
          type: string
          format: uri
        last:
          type: string
          format: uri
        next:
          type: string
          format: uri
        prev:
          type: string
          format: uri
    Error:
      type: object
      required:
      - title
      - detail
      - code
      - status
      properties:
        title:
          type: string
          example: Filter not allowed
        detail:
          type: string
          example: bogus is not allowed.
        code:
          type: string
          description: 'JSONAPI error code. Not an HTTP status: `100` is a validation error, `102` a disallowed filter, `106` a missing parameter, and so on.'
          example: '102'
        status:
          type: string
          description: HTTP status as a string.
          example: '400'
        source:
          type: object
          description: Points at the part of the request that caused the error. Present on validation errors.
          required:
          - pointer
          properties:
            pointer:
              type: string
              example: "/data/attributes/capacity_limit"
        meta:
          type: object
          description: Error-specific details. Carried by a few errors (e.g. insufficient balance).
    ErrorsDocument:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            "$ref": "#/components/schemas/Error"
    PublicKey:
      type: object
      description: An RSA public key for encrypting regulation file uploads.
      required:
      - id
      - type
      - attributes
      properties:
        id:
          type: string
          format: uuid
          example: e5a4e2f1-3b26-4a5c-9a0a-2f7c1f3e8d10
        type:
          type: string
          enum:
          - public_keys
        attributes:
          type: object
          required:
          - key
          properties:
            key:
              type: string
              description: PEM-encoded RSA public key.
              example: |
                -----BEGIN PUBLIC KEY-----
                ...
                -----END PUBLIC KEY-----
    PublicKeyCollectionDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/PublicKey"
    Country:
      type: object
      description: A country DIDWW has, or may have, coverage in.
      required:
      - id
      - type
      - attributes
      - relationships
      properties:
        id:
          type: string
          format: uuid
          example: e5a4e2f1-3b26-4a5c-9a0a-2f7c1f3e8d10
        type:
          type: string
          enum:
          - countries
        attributes:
          type: object
          required:
          - name
          - prefix
          - iso
          properties:
            name:
              type: string
              example: United Kingdom
            prefix:
              type: string
              nullable: true
              description: International dialling prefix, without a leading `+`.
              example: '44'
            iso:
              type: string
              description: ISO 3166-1 alpha-2 code.
              example: GB
        relationships:
          type: object
          required:
          - regions
          properties:
            regions:
              "$ref": "#/components/schemas/RelationshipToMany"
