    EmergencyVerification:
      type: object
      description: A submission registering an address for an emergency calling service.
      required:
      - id
      - type
      - attributes
      - relationships
      properties:
        id:
          type: string
          format: uuid
          example: e5a4e2f1-3b26-4a5c-9a0a-2f7c1f3e8d10
        type:
          type: string
          enum:
          - emergency_verifications
        attributes:
          type: object
          required:
          - reference
          - status
          - reject_reasons
          - reject_comment
          - callback_url
          - callback_method
          - external_reference_id
          - created_at
          properties:
            reference:
              type: string
              description: Human-readable reference.
              example: EV-1234
            status:
              type: string
              description: "`pending` until DIDWW has reviewed the submission."
              enum:
              - approved
              - pending
              - rejected
            reject_reasons:
              type: array
              nullable: true
              description: Why the submission was rejected. Null unless `status` is `rejected`.
              items:
                type: string
            reject_comment:
              type: string
              nullable: true
              description: Free-form note from the reviewer.
            callback_url:
              type: string
              nullable: true
              description: URL notified when the status changes.
            callback_method:
              type: string
              nullable: true
              enum:
              - get
              - post
              -
              description: HTTP method used for the callback.
            external_reference_id:
              type: string
              nullable: true
              description: Customer's own identifier for the verification.
            created_at:
              type: string
              format: date-time
        relationships:
          type: object
          required:
          - address
          - emergency_calling_service
          - dids
          properties:
            address:
              "$ref": "#/components/schemas/RelationshipToOne"
            emergency_calling_service:
              "$ref": "#/components/schemas/RelationshipToOne"
            dids:
              "$ref": "#/components/schemas/RelationshipToMany"
