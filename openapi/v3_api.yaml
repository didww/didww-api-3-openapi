          - status
          - reject_reasons
          - reject_comment
          - service_description
          - callback_url
          - callback_method
          - external_reference_id
          - created_at
          properties:
            reference:
              type: string
              description: Human-readable reference.
              example: AV-1234
            status:
              type: string
              description: "`pending` until DIDWW has reviewed the submission."
              enum:
              - pending
              - approved
              - rejected
            reject_reasons:
              type: array
              nullable: true
              description: Why the submission was rejected. Null unless `status` is `rejected`.
              items:
                type: string
            reject_comment:
              type: string
              nullable: true
              description: Free-form note from the reviewer.
            service_description:
              type: string
              nullable: true
              description: How the numbers will be used. Required where the address requirement says so.
            callback_url:
              type: string
              nullable: true
              description: URL notified when the status changes.
            callback_method:
              type: string
              nullable: true
              enum:
              - get
              - post
              -
              description: HTTP method used for the callback.
            external_reference_id:
              type: string
              nullable: true
              description: Customer's own identifier for the verification.
            created_at:
              type: string
              format: date-time
        relationships:
          type: object
          required:
          - address
          - dids
          properties:
            address:
              "$ref": "#/components/schemas/RelationshipToOne"
            dids:
              "$ref": "#/components/schemas/RelationshipToMany"
