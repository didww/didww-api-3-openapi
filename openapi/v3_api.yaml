    Order:
      type: object
      description: An order. Orders have no relationships; their contents live in `items`.
      required:
      - id
      - type
      - attributes
      properties:
        id:
          type: string
          format: uuid
          example: e5a4e2f1-3b26-4a5c-9a0a-2f7c1f3e8d10
        type:
          type: string
          enum:
          - orders
        attributes:
          type: object
          required:
          - reference
          - description
          - amount
          - status
          - created_at
          - callback_url
          - callback_method
          - external_reference_id
          - items
          properties:
            reference:
              type: string
              description: Human-readable order reference.
              example: KTH-650932
            description:
              type: string
              description: What was ordered.
              example: DID
            amount:
              type: string
              description: Total charged, VAT included, as a decimal string.
              example: '3.6'
            status:
              type: string
              enum:
              - pending
              - completed
              - canceled
              description: "`pending` while the order is being fulfilled."
            created_at:
              type: string
              format: date-time
            callback_url:
              type: string
              nullable: true
              description: URL notified when the order completes.
            callback_method:
              type: string
              nullable: true
              enum:
              - get
              - post
              -
              description: HTTP method used for the callback.
            external_reference_id:
              type: string
              nullable: true
              description: Customer's own identifier for the order.
            items:
              type: array
              description: What the order consists of.
              items:
                description: An ordered item. The shape of `attributes` is determined by `type`.
                anyOf:
                - title: DidOrderItem
                  type: object
                  description: Numbers bought from a stock keeping unit.
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      enum:
                      - did_order_items
                    attributes:
                      type: object
                      required:
                      - qty
                      - nrc
                      - mrc
                      - prorated_mrc
                      - billed_from
                      - billed_to
                      - did_group_id
                      - setup_price
                      - monthly_price
                      properties:
                        qty:
                          type: integer
                          description: Units ordered.
                          example: 1
                        nrc:
                          type: string
                          description: Non-recurring (setup) charge, VAT included, as a decimal string.
                          example: '2.1'
                        mrc:
                          type: string
                          description: Monthly recurring charge, VAT included, as a decimal string.
                          example: '1.5'
                        prorated_mrc:
                          type: boolean
                          description: True when `mrc` was prorated to the remainder of the billing period.
                        billed_from:
                          type: string
                          format: date
                          nullable: true
                          description: Start of the billed period. Null until the item is filled.
                        billed_to:
                          type: string
                          format: date
                          nullable: true
                          description: End of the billed period. Null until the item is filled.
                        did_group_id:
                          type: string
                          format: uuid
                          nullable: true
                          description: DID group the numbers came from.
                        setup_price:
                          type: string
                          description: Deprecated alias of `nrc`, kept for backward compatibility.
                          example: '2.1'
                        monthly_price:
                          type: string
                          description: Deprecated alias of `mrc`, kept for backward compatibility.
                          example: '1.5'
                - title: CapacityOrderItem
                  type: object
                  description: Channels bought for a capacity pool.
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      enum:
                      - capacity_order_items
                    attributes:
                      type: object
                      required:
                      - qty
                      - nrc
                      - mrc
                      - prorated_mrc
                      - billed_from
                      - billed_to
                      - capacity_pool_id
                      properties:
                        qty:
                          type: integer
                          description: Units ordered.
                          example: 1
                        nrc:
                          type: string
                          description: Non-recurring (setup) charge, VAT included, as a decimal string.
                          example: '2.1'
                        mrc:
                          type: string
                          description: Monthly recurring charge, VAT included, as a decimal string.
                          example: '1.5'
                        prorated_mrc:
                          type: boolean
                          description: True when `mrc` was prorated to the remainder of the billing period.
                        billed_from:
                          type: string
                          format: date
                          nullable: true
                          description: Start of the billed period. Null until the item is filled.
                        billed_to:
                          type: string
                          format: date
                          nullable: true
                          description: End of the billed period. Null until the item is filled.
                        capacity_pool_id:
                          type: string
                          format: uuid
                          nullable: true
                          description: Capacity pool the channels were added to.
                - title: EmergencyOrderItem
                  type: object
                  description: Emergency calling activated on a DID.
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      enum:
                      - emergency_order_items
                    attributes:
                      type: object
                      required:
                      - qty
                      - nrc
                      - mrc
                      - prorated_mrc
                      - billed_from
                      - billed_to
                      - emergency_calling_service_id
                      properties:
                        qty:
                          type: integer
                          description: Units ordered.
                          example: 1
                        nrc:
                          type: string
                          description: Non-recurring (setup) charge, VAT included, as a decimal string.
                          example: '2.1'
                        mrc:
                          type: string
                          description: Monthly recurring charge, VAT included, as a decimal string.
                          example: '1.5'
                        prorated_mrc:
                          type: boolean
                          description: True when `mrc` was prorated to the remainder of the billing period.
                        billed_from:
                          type: string
                          format: date
                          nullable: true
                          description: Start of the billed period. Null until the item is filled.
                        billed_to:
                          type: string
                          format: date
                          nullable: true
                          description: End of the billed period. Null until the item is filled.
                        emergency_calling_service_id:
                          type: string
                          format: uuid
                          nullable: true
                          description: Emergency calling service the item created.
                - title: GenericOrderItem
                  type: object
                  description: Any other charge — the fallback for order services without a dedicated item type.
                  required:
                  - type
                  - attributes
                  properties:
                    type:
                      type: string
                      enum:
                      - generic_order_items
                    attributes:
                      type: object
                      required:
                      - qty
                      - nrc
                      - mrc
                      - prorated_mrc
                      - billed_from
                      - billed_to
                      properties:
                        qty:
                          type: integer
                          description: Units ordered.
                          example: 1
                        nrc:
                          type: string
                          description: Non-recurring (setup) charge, VAT included, as a decimal string.
                          example: '2.1'
                        mrc:
                          type: string
                          description: Monthly recurring charge, VAT included, as a decimal string.
                          example: '1.5'
                        prorated_mrc:
                          type: boolean
                          description: True when `mrc` was prorated to the remainder of the billing period.
                        billed_from:
                          type: string
                          format: date
                          nullable: true
                          description: Start of the billed period. Null until the item is filled.
                        billed_to:
                          type: string
                          format: date
                          nullable: true
                          description: End of the billed period. Null until the item is filled.
